name: Build Linux (Stable)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        type: string
        description: Override version tag
      enable_mangling:
        description: 'Enable mangling (longer compilation)'
        type: boolean
        required: true
        default: true
      disable_reh:
        description: Don't build remote extension host
        type: boolean
        required: true
        default: false
      build_cli:
        description: Build separate command-line utility
        type: boolean
        required: true
        default: false
      build_appimage:
        description: Build AppImage
        type: boolean
        required: true
        default: false
      build_deb:
        description: Build DEB
        type: boolean
        required: true
        default: true
      build_rpm:
        description: Build RPM
        type: boolean
        required: true
        default: true
      build_tar:
        description: Build TAR
        type: boolean
        required: true
        default: true
      upload_assets:
        description: Upload assets (artifacts)
        type: boolean
        required: true
        default: true
      release_assets:
        description: Release assets (draft)
        type: boolean
        required: true
        default: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  APP_NAME: VSCodium
  ASSETS_REPOSITORY: ${{ github.repository }}
  BINARY_NAME: codium
  GH_REPO_PATH: ${{ github.repository }}
  ORG_NAME: ${{ github.repository_owner }}
  OS_NAME: linux
  VSCODE_QUALITY: stable
  RELEASE_VERSION: ${{ github.event.inputs.version_tag }}
  SHOULD_BUILD_APPIMAGE: ${{ github.event.inputs.build_appimage == 'true' && 'yes' || 'no' }}
  SHOULD_BUILD_DEB: ${{ github.event.inputs.build_deb == 'true' && 'yes' || 'no' }}
  SHOULD_BUILD_RPM: ${{ github.event.inputs.build_rpm == 'true' && 'yes' || 'no' }}
  SHOULD_BUILD_TAR: ${{ github.event.inputs.build_tar == 'true' && 'yes' || 'no' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      MS_COMMIT: ${{ env.MS_COMMIT }}
      MS_TAG: ${{ env.MS_TAG }}
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone VSCode repo
        run: ./get_repo.sh

  compile:
    needs:
      - check
    runs-on: ubuntu-22.04
    env:
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      VSCODE_ARCH: 'x64'
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 10
          platform: x64

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Kerberos
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev

      - name: Clone VSCode repo
        run: ./get_repo.sh

      - name: Build
        env:
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
          NO_MANGLING: ${{ github.event.inputs.enable_mangling == 'true' && 'no' || 'yes' }}
        run: ./build.sh

      - name: Compress sources artifact
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt

      - name: Upload sources artifact
        uses: actions/upload-artifact@v5
        with:
          name: Sources
          path: ./vscode.tar.gz
          retention-days: 1

  build:
    needs:
      - check
      - compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
          image: vscodium/vscodium-linux-build-agent:focal-x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
          image: vscodium/vscodium-linux-build-agent:focal-arm64
        - slug: ARM32
          vscode_arch: armhf
          npm_arch: arm
          image: vscodium/vscodium-linux-build-agent:focal-armhf
        - slug: RISCV64
          vscode_arch: riscv64
          npm_arch: riscv64
          image: vscodium/vscodium-linux-build-agent:focal-riscv64
        - slug: LOONG64
          vscode_arch: loong64
          npm_arch: loong64
          image: vscodium/vscodium-linux-build-agent:crimson-loong64
        - slug: PPC64
          vscode_arch: ppc64le
          npm_arch: ppc64
          image: vscodium/vscodium-linux-build-agent:focal-ppc64le
    container:
      image: ${{ matrix.image }}
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      DISABLED: ${{ vars[format('DISABLE_STABLE_LINUX_APP_{0}', matrix.slug)] }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    outputs:
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        if: env.DISABLED != 'yes'

      - name: Install dependencies
        run: ./build/linux/deps.sh
        if: env.DISABLED != 'yes'

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        if: env.DISABLED != 'yes'

      - name: Download sources artifact
        uses: actions/download-artifact@v6
        with:
          name: Sources
        if: env.DISABLED != 'yes'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_bin.sh
        if: env.DISABLED != 'yes'

      - name: Prepare assets
        env:
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
          SHOULD_BUILD_CLI: ${{ github.event.inputs.build_cli == 'true' && 'yes' || 'no' }}
        run: ./prepare_assets.sh
        if: env.DISABLED != 'yes'

      - name: Upload assets
        uses: actions/upload-artifact@v5
        with:
          name: VSCodium-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        if: ${{ env.DISABLED != 'yes' && github.event.inputs.upload_assets == 'true' }}

      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          body: "Stable release of **VSCodium**, aligned with the version **${{ env.RELEASE_VERSION }}** of the codebase of **VSCode**."
          prerelease: false
          draft: true
          files: assets/*
        if: ${{ env.DISABLED != 'yes' && github.event.inputs.release_assets == 'true' }}

  reh_linux:
    needs:
      - check
      - compile
    if: ${{ github.event.inputs.disable_reh == 'false' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
        - slug: ARM32
          vscode_arch: armhf
          npm_arch: arm
        - slug: PPC64
          vscode_arch: ppc64le
          npm_arch: ppc64
        - slug: RISCV64
          vscode_arch: riscv64
          npm_arch: riscv64
        - slug: LOONG64
          vscode_arch: loong64
          npm_arch: loong64
        - slug: S390X
          vscode_arch: s390x
          npm_arch: s390x
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      DISABLED: ${{ vars[format('DISABLE_STABLE_LINUX_REH_{0}', matrix.slug)] }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        if: env.DISABLED != 'yes'

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 10
          platform: x64
        if: env.DISABLED != 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
        if: env.DISABLED != 'yes'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
        if: env.DISABLED != 'yes'

      - name: Install Kerberos
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
        if: env.DISABLED != 'yes'

      - name: Download sources artifact
        uses: actions/download-artifact@v6
        with:
          name: Sources
        if: env.DISABLED != 'yes'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_reh.sh
        if: env.DISABLED != 'yes'

      - name: Upload assets
        uses: actions/upload-artifact@v5
        with:
          name: Remote-Extension-Host-Linux-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        if: ${{ env.DISABLED != 'yes' && github.event.inputs.upload_assets == 'true' }}

      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          body: "Stable release of **VSCodium**, aligned with the version **${{ env.RELEASE_VERSION }}** of the codebase of **VSCode**."
          prerelease: false
          draft: true
          files: assets/*
        if: ${{ env.DISABLED != 'yes' && github.event.inputs.release_assets == 'true' }}

  reh_alpine:
    needs:
      - check
      - compile
    if: ${{ github.event.inputs.disable_reh == 'false' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      DISABLED: ${{ vars[format('DISABLE_STABLE_ALPINE_REH_{0}', matrix.slug)] }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      OS_NAME: alpine
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        if: env.DISABLED != 'yes'

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 10
          platform: x64
        if: env.DISABLED != 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
        if: env.DISABLED != 'yes'

      - name: Install Kerberos
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
        if: env.DISABLED != 'yes'

      - name: Download sources artifact
        uses: actions/download-artifact@v6
        with:
          name: Sources
        if: env.DISABLED != 'yes'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/alpine/package_reh.sh
        if: env.DISABLED != 'yes'

      - name: Upload assets
        uses: actions/upload-artifact@v5
        with:
          name: Remote-Extension-Host-Alpine-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        if: ${{ env.DISABLED != 'yes' && github.event.inputs.upload_assets == 'true' }}

      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          body: "Stable release of **VSCodium**, aligned with the version **${{ env.RELEASE_VERSION }}** of the codebase of **VSCode**."
          prerelease: false
          draft: true
          files: assets/*
        if: ${{ env.DISABLED != 'yes' && github.event.inputs.release_assets == 'true' }}
